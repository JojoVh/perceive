name: Build macOS standalone apps

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-macos-apps:
    name: Build perceive + perceive_gui_startup (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Build startup standalone app
        uses: matlab-actions/run-command@v2
        with:
          command: cd("toolbox"); ci_build_startup_standalone("macos")

      - name: Build main perceive standalone app
        uses: matlab-actions/run-command@v2
        with:
          command: cd("toolbox"); ci_build_perceive_standalone("macos_perceive")

      - name: Upload MATLAB build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perceive-macos-build-logs
          path: |
            toolbox/macos_build.log
            toolbox/macos_build_error.txt
            toolbox/macos_perceive_build.log
            toolbox/macos_perceive_build_error.txt
          if-no-files-found: ignore

      - name: Collect macOS .app artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil

          root = pathlib.Path("toolbox")
          out = pathlib.Path("artifacts/macos")
          out.mkdir(parents=True, exist_ok=True)

          apps = sorted(root.rglob("*.app"))
          if not apps:
              raise SystemExit("No .app artifact found under toolbox after build.")

          for app in apps:
              if app.name not in {"perceive.app", "perceive_gui_startup.app"}:
                  continue
              dest = out / app.name
              if dest.exists():
                  shutil.rmtree(dest)
              shutil.copytree(app, dest)
              print(f"Collected app: {dest}")
          PY

      - name: Place app into install folder
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil

          src_root = pathlib.Path("artifacts/macos")
          install_dir = pathlib.Path("install")
          install_dir.mkdir(parents=True, exist_ok=True)

          apps = sorted(src_root.glob("*.app"))
          if not apps:
              raise SystemExit("No .app found in artifacts/macos")
          for app in apps:
              dest = install_dir / app.name
              if dest.exists():
                  shutil.rmtree(dest)
              shutil.copytree(app, dest)
              print(f"Placed app into install folder: {dest}")
          PY

      - name: Commit updated install app to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update macOS standalone app bundles"
          file_pattern: install/*.app/**

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: perceive-macos-apps
          path: artifacts/macos/
          if-no-files-found: error

