name: Build Linux standalone apps

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux-apps:
    name: Build perceive + perceive_gui_startup (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Build startup standalone app
        uses: matlab-actions/run-command@v2
        with:
          command: cd("toolbox"); ci_build_startup_standalone("linux")

      - name: Build main perceive standalone app
        uses: matlab-actions/run-command@v2
        with:
          command: cd("toolbox"); ci_build_perceive_standalone("linux_perceive")

      - name: Upload MATLAB build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perceive-linux-build-logs
          path: |
            toolbox/linux_build.log
            toolbox/linux_build_error.txt
            toolbox/linux_perceive_build.log
            toolbox/linux_perceive_build_error.txt
          if-no-files-found: ignore

      - name: Collect Linux binary artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil, stat

          root = pathlib.Path("toolbox")
          out = pathlib.Path("artifacts/linux")
          out.mkdir(parents=True, exist_ok=True)

          targets = ["perceive_gui_startup", "perceive"]
          for target in targets:
              candidates = []
              for p in root.rglob(target):
                  if not p.is_file():
                      continue
                  if p.suffix == "" and (p.stat().st_mode & stat.S_IXUSR):
                      candidates.append(p)
              if not candidates:
                  raise SystemExit(f"No Linux executable found for {target} under toolbox after build.")
              exe = max(candidates, key=lambda p: p.stat().st_mtime)
              dest = out / target
              shutil.copy2(exe, dest)
              dest.chmod(dest.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
              print(f"Collected Linux executable: {dest}")
          PY

      - name: Place Linux executables into install folder
        shell: bash
        run: |
          mkdir -p install
          cp -f artifacts/linux/perceive_gui_startup install/perceive_gui_startup
          cp -f artifacts/linux/perceive install/perceive
          chmod +x install/perceive_gui_startup
          chmod +x install/perceive

      - name: Commit updated install executable to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update linux standalone executables"
          file_pattern: |
            install/perceive_gui_startup
            install/perceive

      - name: Upload Linux executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perceive-linux-bins
          path: artifacts/linux/
          if-no-files-found: error

