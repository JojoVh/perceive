name: Build Linux startup app

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux-app:
    name: Build perceive_gui_startup (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Build standalone startup app
        uses: matlab-actions/run-command@v2
        with:
          command: cd("toolbox"); ci_build_startup_standalone("linux")

      - name: Upload MATLAB build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perceive_gui_startup-linux-build-logs
          path: |
            toolbox/linux_build.log
            toolbox/linux_build_error.txt
          if-no-files-found: ignore

      - name: Collect Linux binary artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil, stat

          root = pathlib.Path("toolbox")
          out = pathlib.Path("artifacts/linux")
          out.mkdir(parents=True, exist_ok=True)

          candidates = []
          for p in root.rglob("perceive_gui_startup"):
              if not p.is_file():
                  continue
              # Linux executable should have execute bit and no extension.
              if p.suffix == "" and (p.stat().st_mode & stat.S_IXUSR):
                  candidates.append(p)

          if not candidates:
              raise SystemExit("No Linux perceive_gui_startup executable found under toolbox after build.")

          exe = max(candidates, key=lambda p: p.stat().st_mtime)
          dest = out / "perceive_gui_startup"
          shutil.copy2(exe, dest)
          dest.chmod(dest.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          print(f"Collected Linux executable: {dest}")
          PY

      - name: Place Linux executable into install folder
        shell: bash
        run: |
          mkdir -p install
          cp -f artifacts/linux/perceive_gui_startup install/perceive_gui_startup
          chmod +x install/perceive_gui_startup

      - name: Commit updated install executable to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update linux startup executable"
          file_pattern: install/perceive_gui_startup

      - name: Upload Linux executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: perceive_gui_startup-linux-bin
          path: artifacts/linux/perceive_gui_startup
          if-no-files-found: error

